<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0C0A08" />
    <meta
      name="description"
      content="منوی دیجیتال و سفارش‌دهی میزی برای کافه و رستوران — با پنج ظاهر متفاوت برای هر رستوران."
    />
    <title>منوی دیجیتی · نواره</title>

    <!-- Self-hosted fonts: no render-blocking third-party request -->
    <link
      rel="preload"
      href="/fonts/vazirmatn-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/cormorant-300.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Above-the-fold photography, preloaded so the hero never pops in. -->
    <link
      rel="preload"
      as="image"
      href="/images/sig-brew-sm.webp"
      fetchpriority="high"
    />
    <style>
      /* Paint the correct background before any stylesheet resolves, so a theme
         switch never flashes the previous theme's base colour. */
      html[data-theme='muse'] { background: #1b1226; }
      html[data-theme='minima'] { background: #f6f5f2; }
      html[data-theme='verde'] { background: #f4f0e6; }
      html[data-theme='pulse'] { background: #08080a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
